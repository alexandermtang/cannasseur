<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password &middot; cannasseur</title>
<link rel="icon" href="img/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital@0;1&family=Work+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #F4F3EF;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100%;
    font-family: 'Work Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  .screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    padding: 24px;
  }
  .logo {
    width: 150px;
    height: 150px;
    object-fit: contain;
  }
  h1 {
    margin: -8px 0 8px;
    color: #000;
    font-family: 'Playfair Display', Georgia, serif;
    font-style: italic;
    font-weight: 400;
    font-size: 40px;
  }
  .open-app {
    display: none;
    margin-bottom: 32px;
    color: #000;
    font-family: 'Work Sans', sans-serif;
    font-size: 14px;
    text-decoration: none;
    border-bottom: 1px solid #000;
  }
  form {
    width: 80%;
    max-width: 320px;
  }
  input {
    display: block;
    width: 100%;
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 20px;
    color: #000;
    background: transparent;
    border: none;
    border-bottom: 1px solid #000;
    padding: 8px;
    margin-bottom: 8px;
  }
  input::placeholder {
    color: #666;
  }
  input:focus {
    outline: none;
  }
  .message {
    font-size: 16px;
    font-family: 'Work Sans', sans-serif;
    height: 24px;
    line-height: 24px;
  }
  .message.error {
    color: #f00;
  }
  .message.notice {
    color: #000;
  }
  button {
    display: block;
    width: 100%;
    height: 48px;
    border: none;
    border-radius: 8px;
    background: #000;
    color: #fff;
    font-family: 'Work Sans', sans-serif;
    font-size: 16px;
    cursor: pointer;
  }
  button:disabled {
    opacity: 0.5;
    cursor: default;
  }
  /* Matches the box the app's GO BACK button would occupy below LOG IN -
     kept purely so this page's layout matches the native screen's spacing. */
  .spacer {
    width: 80%;
    max-width: 320px;
    height: 48px;
    margin-top: 96px;
  }
</style>
</head>
<body>

<div class="screen">
  <img class="logo" src="img/icon.png" alt="cannasseur">
  <h1>cannasseur</h1>
  <a class="open-app" id="open-app-link">Open in app</a>
  <form id="reset-form">
    <input type="password" id="password" placeholder="new password" autocomplete="new-password">
    <input type="password" id="confirm-password" placeholder="confirm password" autocomplete="new-password">
    <div class="message" id="message"></div>
    <button type="submit">UPDATE PASSWORD</button>
  </form>
  <div class="spacer"></div>
</div>

<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

  // Same publishable URL/key the app itself ships embedded in its bundle -
  // not secret, gated by RLS (see supabase/schema.sql).
  const supabase = createClient(
    'https://bwaqmnmxxhoifgxyebqk.supabase.co',
    'sb_publishable_877CjSBStUmkcWa6DBL9Rg_M6t6KsLC'
  );

  const form = document.getElementById('reset-form');
  const messageEl = document.getElementById('message');
  const passwordEl = document.getElementById('password');
  const confirmPasswordEl = document.getElementById('confirm-password');
  const openAppLink = document.getElementById('open-app-link');

  const setMessage = (text, type) => {
    messageEl.textContent = text;
    messageEl.className = 'message' + (type ? ' ' + type : '');
  };

  (function establishRecoverySession() {
    const hash = window.location.hash.replace(/^#/, '');
    const params = new URLSearchParams(hash);
    const accessToken = params.get('access_token');
    const refreshToken = params.get('refresh_token');

    if (params.get('type') === 'recovery' && accessToken && refreshToken) {
      supabase.auth.setSession({ access_token: accessToken, refresh_token: refreshToken });

      // Hand off to the app when it's installed - most people open this link
      // on the same phone the app is on. The automatic attempt only works
      // when the browser treats it as part of the user's original tap on the
      // email link (some mail apps' in-app browsers are stricter about
      // that), so the visible link is the reliable fallback, not a backup
      // for a backup.
      const appUrl = 'cannasseur://reset-password#' + hash;
      openAppLink.href = appUrl;
      openAppLink.style.display = 'inline-block';
      window.location.href = appUrl;
    } else {
      setMessage('This reset link is invalid or has expired.', 'error');
      form.querySelectorAll('input, button').forEach(el => (el.disabled = true));
    }
  })();

  form.addEventListener('submit', async event => {
    event.preventDefault();
    setMessage('', '');

    if (passwordEl.value === '') {
      setMessage('Missing password.', 'error');
      return;
    }

    if (passwordEl.value !== confirmPasswordEl.value) {
      setMessage('Passwords must match.', 'error');
      return;
    }

    const { error } = await supabase.auth.updateUser({ password: passwordEl.value });

    if (error) {
      setMessage(error.message, 'error');
      return;
    }

    setMessage('Password updated.', 'notice');
    form.querySelectorAll('input, button').forEach(el => (el.disabled = true));
  });
</script>

</body>
</html>
