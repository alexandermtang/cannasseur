<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Email confirmed &middot; cannasseur</title>
<link rel="icon" href="img/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital@0;1&family=Work+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #F4F3EF;
    color: #000;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100%;
    padding: 48px 24px;
    font-family: 'Work Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    text-align: center;
  }
  .icon {
    width: 80px;
    height: 80px;
    object-fit: contain;
    margin-bottom: 24px;
  }
  h1 {
    font-family: 'Playfair Display', Georgia, serif;
    font-style: italic;
    font-weight: 400;
    font-size: 32px;
    margin: 0 0 12px;
    letter-spacing: 0.5px;
  }
  p.subtext {
    font-size: 16px;
    color: #9B9B9B;
    margin: 0 0 32px;
    max-width: 320px;
    line-height: 1.5;
  }
  .button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 240px;
    height: 48px;
    background: #000;
    color: #FFF;
    font-family: 'Work Sans', sans-serif;
    font-size: 16px;
    text-decoration: none;
    border-radius: 8px;
    margin-bottom: 16px;
  }
  .home-link {
    font-size: 14px;
    color: #9B9B9B;
    text-decoration: none;
    border-bottom: 1px solid #d8d8d8;
  }
  .home-link:hover {
    border-bottom-color: #000;
  }
</style>
</head>
<body>

<img class="icon" src="img/icon.png" alt="cannasseur">
<h1>Email confirmed</h1>
<p class="subtext">You're all set. Head back to the app and log in with your new account.</p>

<a class="button" href="cannasseur://login">Open cannasseur</a>
<a class="home-link" href="/">cannasseur.app</a>

</body>
</html>
